name: OOS KernelSU-Next for OnePlus-7-Series

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env: 
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "7G"
      CCACHE_HARDLINK: "true"
      
    steps:
      - name: 🚀 Enable ccache to speed the build up
        uses: hendrikmuhs/ccache-action@v1.2
      - name: Remove unnecessary files
        run: |
         sudo rm -rf /opt/ghc
         sudo rm -rf "/usr/local/share/boost"
         sudo rm -rf /usr/share/dotnet
         sudo rm -rf "$AGENT_TOOLSDIRECTORY"

#      - name: Install dependencies
#        run: |
#         sudo apt-get update -y 
#         sudo apt install gcc-aarch64-linux-gnu -y
#         sudo apt install gcc-arm-linux-gnueabi -y
#         sudo apt install binutils make python3 libssl-dev build-essential bc  bison flex unzip libssl-dev ca-certificates xz-utils mkbootimg cpio device-tree-compiler git git-lfs -y
#         sudo apt install libelf-dev libarchive-tools lld llvm axel binutils make python3 libssl-dev build-essential bc  bison flex unzip libssl-dev ca-certificates xz-utils mkbootimg cpio device-tree-compiler git git-lfs -y
#         sudo apt install openjdk-17-jdk-headless -y
         
         # axel -q -n 6 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz
         # mkdir clang && tar -zxvf linux-x86-refs_heads_main-clang-r547379.tar.gz -C clang

         # git clone https://github.com/beingsk5/Snapdragon-LLVM-ARM-Compiler-10.0.7-for-Android-NDK -b main clang --depth=1
         # git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 aarch64 --depth=1
         
#      - name: 📂 Checkout builder's sourcecode and get files
#        uses: actions/checkout@v4
        
      - name: ⚡ Checkout kernel's sourcecode and clone submodules
        run: |
          rm -rf kernel
          git clone --recurse-submodules --depth=1 https://github.com/beingsk5/android_kernel_oneplus_sm8150 kernel -b oneplus/sm8150_s_12.1_op7pro

#      - name: Add Re:binder support
#        run: |
#         export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
#         cd kernel
#         wget https://github.com/Sakion-Team/Re-Kernel/releases/download/modifier/Kernel-Modifier-v4.0.jar
#         /usr/lib/jvm/java-17-openjdk-amd64/bin/java -jar ./Kernel-Modifier-v4.0.jar
#         cd ..
 
      - name: 📅 Export date of build
        run: |
          echo "DATE=$(date +%d%m%Y)" >> $GITHUB_ENV
   
      - name: 🔄 Update KernelSU-Next
        run: |
          cd kernel 
          patch -p1 < kernelsu.patch
          patch -p1 < path_umount.patch
          patch -p1 < gcc_wrapper.patch
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -
          cd ..
          
      - name: 📥 Clone AnyKernel3
        run: |
          cd kernel
          git clone -b master --depth=1 https://github.com/beingsk5/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          
      - name: 🔍 Device's codename and kernel's version
        run: |
          cd kernel
          DEVICE_CODENAME=OnePlus-7-Series
          KERNEL_VERSION=$(make kernelversion)
          echo "Device Codename: $DEVICE_CODENAME"
          echo "Kernel Version: $KERNEL_VERSION"
          echo "DEVICE_CODENAME=$DEVICE_CODENAME" >> $GITHUB_ENV
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          cd kernel
          chmod +x build_4.14.sh
          ./build_4.14.sh
          echo "✅ Kernel build completed"

      - name: 🚀 Copy the compiled kernel to AnyKernel3 then create the zip
        run: |
          cd kernel
          ZIP_NAME="RagnaR-OOS-${DEVICE_CODENAME}-${KERNEL_VERSION}-$(date +%d%m%Y).zip"
          echo "📦 Preparing $ZIP_NAME ..."
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "✅ Found Image.gz-dtb"
            cp out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "✅ Found Image.gz"
            cp out/arch/arm64/boot/Image.gz anykernel/zImage
          elif [ -f out/arch/arm64/boot/Image ]; then
            echo "✅ Found Image"
            cp out/arch/arm64/boot/Image anykernel/zImage
          else
            echo "❌ No kernel image found! Build may have failed."
          exit 1
          fi
          
          cd anykernel && zip -r9 $ZIP_NAME ./*
          mv $ZIP_NAME ../../
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          
      - name: 🤌 Copy zip file to get 2 different zip files
        run: |
          ZIP_ALTERNATIVE="KernelSU-Next-OOS-RagnaR-${DEVICE_CODENAME}-latest.zip"
          cp ${ZIP_NAME} $ZIP_ALTERNATIVE
          echo "Copied ${ZIP_NAME} as $ZIP_ALTERNATIVE"
          echo "ZIP_ALTERNATIVE=$ZIP_ALTERNATIVE" >> $GITHUB_ENV
          
      - name: 📤 Publish github release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_ALTERNATIVE }}
          tag_name: "RagnaR-OOS-latest"
          draft: false
          prerelease: false
          body: |
            Device: Oneplus 7 Series All Device Supported
            Target: OOS A12

      - name: 📤 Publish with tag associated to the kernel and the date
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: RagnaR-OOS-${{ env.DATE }}
          draft: false
          prerelease: false
          body: |
            Device: Oneplus 7 Series All Device Supported
            Target: OOS A12
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
